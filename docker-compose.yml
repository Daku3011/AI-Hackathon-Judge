services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app # For hot reloading in dev
      # Frontend is now built inside the container and served from /app/frontend/dist
    restart: always

# Frontend can be deployed separately or added here if needed
# But for production, static hosting (like Vercel) is recommended for frontend.
