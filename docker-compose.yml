version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app # Optional: for hot reloading in dev
      - ./frontend:/frontend # Mount frontend for static serving
    restart: always

# Frontend can be deployed separately or added here if needed
# But for production, static hosting (like Vercel) is recommended for frontend.
